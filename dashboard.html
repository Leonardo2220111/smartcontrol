<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gerenciamento de Vendas</title>
</head>
<body>

    <header>
        <h1>GERENCIAMENTO DE VENDAS</h1>
    </header>

    <main>

        <section>

            <div>
                <h3>Veículo mais vendido</h3>
                <canvas id="graficoVeiculo"></canvas>
            </div>

            <div>
                <h3>Marca mais procurada</h3>
                <canvas id="graficoMarca"></canvas>
            </div>

            <div>
                <h3>Carro mais vendido</h3>
                <canvas id="graficoCarro"></canvas>
            </div>

            <div>
                <h3>Moto mais vendida</h3>
                <canvas id="graficoMoto"></canvas>

                <br>

                <button>+ GERAR RELATÓRIO</button>
            </div>

        </section>

    </main>

</body>
</html>
