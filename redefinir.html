<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinir senha</title>

    <link rel="stylesheet" href="assets/css/rdf.css">
</head>

<body>

    <div class="logo">
        <img src="assets/image/mannel.png" alt="imagem logo">
    </div>
    
    <div class="container">

        <p>
            Redefina sua senha
        </p>

        <form action="#" method="POST">

            <label for="senha">Nova senha</label>

            <input
                type="text"
                id="senha"
                name="senha"
                placeholder="Digite sua nova senha"
                minlength="8"
                required
            >

            <label for="confirmar-senha">Confirmar nova senha</label>

            <input
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                placeholder="Confirme a senha"
                minlength="8"
                required
            >

            <button type="submit">
                REDEFINIR SENHA
            </button>

        </form>

        <a href="login.html" class="voltar">
            Voltar para o login
        </a>

    </div>

</body>

</html>
