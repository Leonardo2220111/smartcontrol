<body>

    <img src="assets/images/logo.png" alt="imagem-logo">
    <h1>Cadastro</h1>
    <form action="index.html"method="get"></form>
        <label for="nome_completo">NOME COMPLETO</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite seu nome completo" required><br><br>

        <label for="e_mail">E-MAIL</label>
        <input type="text" name="e_mail" id="e_mail" placeholder="Digite seu E-mail" required><br><br>

        <label for="senha">SENHA</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua Senha" minlenght="8" required><br><br>
        
        <label for="termos_de_uso">ACEITO OS TERMOS DE USO</label>
        <input type="checkbox" name="termos_de_uso" id="termos_de_uso">

        <button type="submit">CADASTRAR</button>

    </form>
