<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRO SMART CONTROL</title>
</head>
<body>
    <img src="assets/images/download.png" alt="imagem logo">

    <h1>CADASTRO</h1>
    <form action="index.html" method="get">
        <label for="nome_completo">NOME COMPLETO</label>
        <input type="text" name="nome_completo" id="nome_completo" placeholder="Digite seu nome completo" required><br>

        <label for="e_mail">E-MAIL</label>
        <input type="email" name="e_mail" id="e_mail" placeholder="Digite seu E-mail" required><br><br>

        <label for="senha">SENHA</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" minlength="8" required><br><br>

        <input type="checkbox" name="termos_de_uso" id="termos_de_uso">
        <label for="termos_de_uso">Aceito todos os termos de uso</label>

        <button type="submit">CADASTRAR</button>

    </form>
    <footer>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3707.102854440699!2d-43.427614924521436!3d-21.">
    </footer>

</body>
</html>
